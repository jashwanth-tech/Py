name: Render Manim Animation

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest
    container:
      image: manimcommunity/manim:latest
      options: --user root

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Render Video
        run: manim -qh --resolution 1080,1920 superluminal_laser.py SuperluminalLaser

      - name: Upload Video Artifact
        uses: actions/upload-artifact@v4
        with:
          name: superluminal-laser-video
          path: media/videos/superluminal_laser/**/*.mp4
          retention-days: 7
