name: Render Cinematic Space Film

on:
  workflow_dispatch:
    inputs:
      preview_mode:
        description: 'Run 10s preview (true) or full 50s master (false)?'
        required: true
        default: 'false'
        type: boolean

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Mesa Software Graphics & FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ffmpeg \
            xvfb \
            mesa-utils \
            libgl1-mesa-dri \
            libgl1 \
            libglx-mesa0 \
            libgbm-dev \
            libnss3 \
            libxss1 \
            libatk-bridge2.0-0 \
            libgtk-3-0

      - name: Synthesize Realistic Astrophysics Engine
        run: |
          mkdir -p public scripts output

          # 1. package.json
          cat << 'EOF' > package.json
          {
            "name": "cinematic-space-dynamics",
            "version": "5.0.0",
            "type": "module",
            "scripts": {
              "render": "node scripts/render.js",
              "render:preview": "node scripts/render.js --preview"
            },
            "dependencies": {
              "express": "^4.19.2",
              "puppeteer": "^22.6.0",
              "three": "^0.163.0"
            }
          }
          EOF

          # 2. scripts/render.js
          cat << 'EOF' > scripts/render.js
          import express from 'express';
          import puppeteer from 'puppeteer';
          import { spawn } from 'child_process';
          import path from 'path';
          import fs from 'fs';
          import { fileURLToPath } from 'url';

          const __dirname = path.dirname(fileURLToPath(import.meta.url));
          const ROOT = path.resolve(__dirname, '..');
          const isPreview = process.argv.includes('--preview');

          const FPS = 30;
          const DURATION = isPreview ? 10 : 50;
          const TOTAL_FRAMES = FPS * DURATION;
          const OUT_DIR = path.join(ROOT, 'output');
          const OUT_FILE = path.join(OUT_DIR, 'astrophysics_masterpiece.mp4');

          if (!fs.existsSync(OUT_DIR)) fs.mkdirSync(OUT_DIR, { recursive: true });

          const app = express();
          app.use(express.static(ROOT));
          const server = app.listen(8085, async () => {
            console.log(`[Film Pipeline] Target: 1080x1920 @ ${FPS} FPS (${TOTAL_FRAMES} frames)`);

            const ffmpeg = spawn('ffmpeg', [
              '-y', '-f', 'image2pipe', '-vcodec', 'png', '-r', String(FPS),
              '-i', '-', '-c:v', 'libx264', '-preset', 'slow', '-crf', '16',
              '-pix_fmt', 'yuv420p', '-movflags', '+faststart', OUT_FILE
            ]);

            ffmpeg.stderr.on('data', (d) => {
              const msg = d.toString();
              if (msg.includes('Error') || msg.includes('fatal')) console.error(`[FFmpeg] ${msg}`);
            });

            const browser = await puppeteer.launch({
              headless: 'new',
              args: [
                '--no-sandbox',
                '--disable-setuid-sandbox',
                '--disable-dev-shm-usage',
                '--disable-gpu-sandbox',
                '--enable-webgl',
                '--ignore-gpu-blocklist',
                '--use-gl=angle',
                '--use-angle=gl',
                '--window-size=1080,1920'
              ]
            });

            const page = await browser.newPage();
            await page.setViewport({ width: 1080, height: 1920, deviceScaleFactor: 1 });

            page.on('console', msg => console.log(`[Browser] ${msg.text()}`));
            page.on('pageerror', err => console.error(`[Browser Error] ${err.toString()}`));

            await page.goto('http://localhost:8085/public/index.html', { waitUntil: 'load' });

            console.log('[Film Pipeline] Compiling barred spiral galaxy and shaders...');
            await page.waitForFunction(() => typeof window.renderMasterFrame === 'function', { timeout: 60000 });
            console.log('[Film Pipeline] Initialization complete. Starting frame capture.');

            const startWall = Date.now();

            for (let f = 0; f < TOTAL_FRAMES; f++) {
              await page.evaluate((frameIdx, total) => window.renderMasterFrame(frameIdx, total), f, TOTAL_FRAMES);
              const canvas = await page.$('#webgl-canvas');
              const frameBuf = await canvas.screenshot({ type: 'png' });
              ffmpeg.stdin.write(frameBuf);

              if (f % 30 === 0 || f === TOTAL_FRAMES - 1) {
                const elapsedSec = ((Date.now() - startWall) / 1000).toFixed(1);
                const percent = (((f + 1) / TOTAL_FRAMES) * 100).toFixed(1);
                const fpsReal = ((f + 1) / (Date.now() - startWall) * 1000).toFixed(2);
                console.log(`[Render] Frame ${f + 1}/${TOTAL_FRAMES} (${percent}%) | Elapsed: ${elapsedSec}s | Speed: ${fpsReal} FPS`);
              }
            }

            ffmpeg.stdin.end();
            await new Promise(res => ffmpeg.on('close', res));
            await browser.close();
            server.close();
            console.log('━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━');
            console.log(`[Render Success] Master video generated: ${OUT_FILE}`);
            console.log('━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━');
            process.exit(0);
          });
          EOF

          # 3. public/index.html
          cat << 'EOF' > public/index.html
          <!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="UTF-8">
            <title>The Architecture of Cosmic Motion</title>
            <style>
              * { box-sizing: border-box; margin: 0; padding: 0; }
              body {
                overflow: hidden;
                background: #000003;
                font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
                color: #ffffff;
              }
              #webgl-canvas { width: 1080px; height: 1920px; display: block; }
              
              #hud-overlay {
                position: absolute; top: 0; left: 0; width: 1080px; height: 1920px;
                pointer-events: none; display: flex; flex-direction: column;
                justify-content: space-between; padding: 80px 50px 70px 50px; z-index: 100;
              }
              .hud-pill {
                display: inline-flex; align-items: center; gap: 8px;
                background: rgba(10, 16, 32, 0.65);
                backdrop-filter: blur(12px);
                border: 1px solid rgba(255, 255, 255, 0.15);
                border-radius: 30px;
                padding: 10px 22px;
                font-size: 14px; letter-spacing: 3px; font-weight: 700;
                color: #55a8ff; text-transform: uppercase;
              }
              .hud-top-card {
                background: rgba(5, 8, 18, 0.55);
                backdrop-filter: blur(14px);
                border: 1px solid rgba(255, 255, 255, 0.12);
                border-radius: 18px;
                padding: 24px 30px;
                margin-top: 14px;
              }
              #hud-title {
                font-size: 44px; font-weight: 900; letter-spacing: -0.5px; margin-top: 6px; line-height: 1.1;
              }
              .hud-stat-grid {
                display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 14px;
              }
              .stat-box {
                background: rgba(255, 255, 255, 0.04);
                border-radius: 10px; padding: 10px 14px;
              }
              .stat-lbl {
                font-size: 12px; letter-spacing: 2px; color: rgba(255, 255, 255, 0.5); text-transform: uppercase; font-weight: 600;
              }
              .stat-val {
                font-size: 17px; font-weight: 700; font-family: "SF Mono", Menlo, monospace; margin-top: 3px;
              }

              #script-card {
                background: rgba(4, 7, 16, 0.75);
                backdrop-filter: blur(16px);
                border-left: 5px solid #55a8ff;
                border-radius: 4px 14px 14px 4px;
                padding: 24px 28px;
                margin-top: auto; margin-bottom: 20px;
                box-shadow: 0 15px 40px rgba(0, 0, 0, 0.7);
              }
              #script-text {
                font-size: 28px; line-height: 1.35; font-weight: 600; color: #f4f6fa; letter-spacing: -0.2px;
              }
            </style>
            <script type="importmap">
              { "imports": { "three": "/node_modules/three/build/three.module.js" } }
            </script>
          </head>
          <body>
            <canvas id="webgl-canvas" width="1080" height="1920"></canvas>

            <div id="hud-overlay">
              <div>
                <div id="act-tag" class="hud-pill">ACT I • THE TERRESTRIAL FRAME</div>
                <div class="hud-top-card">
                  <div id="hud-title">EARTH'S ROTATION</div>
                  <div class="hud-stat-grid">
                    <div class="stat-box">
                      <div class="stat-lbl">Reference Frame</div>
                      <div id="stat-frame" class="stat-val" style="color: #64d2ff;">EARTH SURFACE</div>
                    </div>
                    <div class="stat-box">
                      <div class="stat-lbl">Frame Velocity</div>
                      <div id="stat-vel" class="stat-val" style="color: #ffd60a;">1,674 KM/H</div>
                    </div>
                    <div class="stat-box">
                      <div class="stat-lbl">Scale Perspective</div>
                      <div id="stat-scale" class="stat-val" style="color: #ff9f0a;">PLANETOCENTRIC</div>
                    </div>
                    <div class="stat-box">
                      <div class="stat-lbl">Physical Invariant</div>
                      <div id="stat-inv" class="stat-val" style="color: #30d158;">23.44° AXIAL TILT</div>
                    </div>
                  </div>
                </div>
              </div>

              <div id="script-card">
                <div style="font-size: 12px; letter-spacing: 3px; color: #55a8ff; font-weight: 700; margin-bottom: 6px;">NARRATION SCRIPT</div>
                <div id="script-text">"Right now, sitting in your room, you feel completely motionless..."</div>
              </div>
            </div>

            <script type="module">
              import * as THREE from 'three';

              const ASTRO = {
                OBLIQUITY_RAD: THREE.MathUtils.degToRad(23.439),
                ECLIPTIC_TILT_RAD: THREE.MathUtils.degToRad(60.19),
                VEL_RATIO: 7.387,
                AU: 95.0,
                SUN_RADIUS: 15.0,
                EARTH_RADIUS: 3.5,
                TOTAL_DURATION: 50.0,
                EARTH_ORBIT_PERIOD_SEC: 12.0
              };

              function createFbmTexture(w, h, type) {
                const c = document.createElement('canvas');
                c.width = w; c.height = h;
                const ctx = c.getContext('2d');
                const img = ctx.createImageData(w, h);
                const d = img.data;

                for (let y = 0; y < h; y++) {
                  const lat = (y / h) * Math.PI - Math.PI / 2.0;
                  for (let x = 0; x < w; x++) {
                    const lon = (x / w) * Math.PI * 2.0 - Math.PI;
                    const idx = (y * w + x) * 4;

                    if (type === 'earth') {
                      let n = Math.sin(lon * 2.0) * Math.cos(lat * 2.0)
                            + Math.sin(lon * 5.0 + lat * 3.0) * 0.5
                            + Math.sin(lon * 11.0 - lat * 7.0) * 0.25
                            + Math.cos(lon * 21.0 + lat * 13.0) * 0.12;

                      const isLand = n > 0.05 && Math.abs(lat) < 1.35;
                      const isIce = Math.abs(lat) >= 1.35 || (Math.abs(lat) > 1.15 && n > 0.15);

                      if (isIce) {
                        d[idx] = 230; d[idx + 1] = 240; d[idx + 2] = 250;
                      } else if (isLand) {
                        const elevation = (n - 0.05) * 3.0;
                        d[idx] = 34 + elevation * 40;
                        d[idx + 1] = 95 + elevation * 30;
                        d[idx + 2] = 40 + elevation * 15;
                      } else {
                        const depth = Math.max(0.0, -n);
                        d[idx] = 10 + depth * 15;
                        d[idx + 1] = 35 + depth * 45;
                        d[idx + 2] = 110 + depth * 75;
                      }
                      d[idx + 3] = 255;
                    } else if (type === 'clouds') {
                      const swirl = Math.sin(lon * 3.0 + Math.cos(lat * 5.0) * 1.5)
                                  + Math.sin(lon * 8.0 - lat * 4.0) * 0.6
                                  + Math.cos(lon * 16.0 + lat * 9.0) * 0.3;
                      const cloudVal = swirl > 0.35 ? Math.min(255, (swirl - 0.35) * 420) : 0;
                      d[idx] = 255; d[idx + 1] = 255; d[idx + 2] = 255;
                      d[idx + 3] = cloudVal;
                    } else if (type === 'sun') {
                      const grain = Math.sin(x * 0.1) * Math.cos(y * 0.1) + Math.sin(x * 0.3 + y * 0.2) * 0.5;
                      d[idx] = 255;
                      d[idx + 1] = 220 + grain * 20;
                      d[idx + 2] = 130 + grain * 40;
                      d[idx + 3] = 255;
                    }
                  }
                }
                ctx.putImageData(img, 0, 0);
                return new THREE.CanvasTexture(c);
              }

              function createCoronaTexture() {
                const c = document.createElement('canvas');
                c.width = 512; c.height = 512;
                const ctx = c.getContext('2d');
                const grad = ctx.createRadialGradient(256, 256, 10, 256, 256, 256);
                grad.addColorStop(0.0, 'rgba(255, 250, 220, 1.0)');
                grad.addColorStop(0.15, 'rgba(255, 200, 80, 0.85)');
                grad.addColorStop(0.45, 'rgba(255, 120, 20, 0.35)');
                grad.addColorStop(0.8, 'rgba(180, 50, 10, 0.08)');
                grad.addColorStop(1.0, 'rgba(0, 0, 0, 0.0)');
                ctx.fillStyle = grad;
                ctx.fillRect(0, 0, 512, 512);
                return new THREE.CanvasTexture(c);
              }

              const canvas = document.getElementById('webgl-canvas');
              const glOptions = { antialias: true, preserveDrawingBuffer: true, failIfMajorPerformanceCaveat: false };
              const gl = canvas.getContext('webgl2', glOptions) || canvas.getContext('webgl', glOptions);
              const renderer = new THREE.WebGLRenderer({ canvas, context: gl, antialias: true, preserveDrawingBuffer: true });
              renderer.setSize(1080, 1920, false);
              renderer.toneMapping = THREE.ACESFilmicToneMapping;
              renderer.toneMappingExposure = 1.2;

              const scene = new THREE.Scene();
              const camera = new THREE.PerspectiveCamera(48, 1080 / 1920, 0.1, 100000);

              // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
              // 1. ASTROPHYSICAL MILKY WAY GALAXY (Barred SBbc Structure)
              // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
              // Eliminates the "S" shape by using:
              // - A dense, elongated Central Bar
              // - A continuous exponential disk
              // - 4 logarithmic spiral density wave arms
              const TOTAL_GALAXY_STARS = 120000;
              const galGeo = new THREE.BufferGeometry();
              const galPos = new Float32Array(TOTAL_GALAXY_STARS * 3);
              const galColors = new Float32Array(TOTAL_GALAXY_STARS * 3);

              const cCore = new THREE.Color(0xffdfa4); // Warm stellar population II
              const cArm = new THREE.Color(0x7ebbff);  // Young OB associations in arms
              const cDisk = new THREE.Color(0xdce7ff); // Neutral disk population

              for (let i = 0; i < TOTAL_GALAXY_STARS; i++) {
                const i3 = i * 3;
                let x, y, z;
                let starColor;

                if (i < 25000) {
                  // 1. ELONGATED CENTRAL BAR & BULGE (Triaxial ellipsoid)
                  // Semi-major axis along X ~ 2200, Y ~ 900, Z (thickness) ~ 600
                  const u = Math.random();
                  const barRadius = Math.pow(u, 1.8) * 2200.0;
                  const barAngle = (Math.random() - 0.5) * 0.7; // Elongated angle
                  const sign = Math.random() < 0.5 ? 1 : -1;
                  
                  x = Math.cos(barAngle) * barRadius * sign + (Math.random() - 0.5) * 350.0;
                  z = Math.sin(barAngle) * (barRadius * 0.42) * sign + (Math.random() - 0.5) * 350.0;
                  y = (Math.random() - 0.5) * (Math.exp(-barRadius / 1500.0) * 500.0 + 40.0);
                  
                  starColor = cCore.clone().lerp(cDisk, Math.random() * 0.25);
                } else if (i < 65000) {
                  // 2. EXPONENTIAL SMOOTH DISK (Fills between the arms)
                  // P(r) ~ r * exp(-r / R_d)
                  const r = Math.sqrt(-2.0 * Math.log(1.0 - Math.random())) * 3200.0;
                  const theta = Math.random() * Math.PI * 2.0;

                  x = Math.cos(theta) * r;
                  z = Math.sin(theta) * r;
                  y = (Math.random() - 0.5) * (Math.exp(-r / 4000.0) * 280.0 + 25.0);

                  starColor = cDisk.clone().lerp(cCore, Math.max(0.0, 1.0 - r / 3000.0));
                } else {
                  // 3. FOUR SPIRAL ARMS (Lin-Shu Density Wave Perturbation)
                  // 4 major arms: Perseus, Scutum-Centaurus, Sagittarius, Norma
                  const armIndex = i % 4;
                  const armBaseAngle = armIndex * (Math.PI / 2.0); // 90° intervals

                  // Radius from bar tip out to galactic rim
                  const r = 1600.0 + Math.pow(Math.random(), 1.4) * 7500.0;
                  // Logarithmic spiral pitch
                  const spiralTwist = Math.log(r / 1200.0) * 2.85;

                  // Gaussian dispersion around the arm spine (broad density wave)
                  const armScatter = (Math.random() - 0.5) * (r * 0.22 + 90.0);
                  const scatterAngle = Math.random() * Math.PI * 2.0;

                  const totalTheta = armBaseAngle + spiralTwist;
                  x = Math.cos(totalTheta) * r + Math.cos(scatterAngle) * armScatter;
                  z = Math.sin(totalTheta) * r + Math.sin(scatterAngle) * armScatter;
                  y = (Math.random() - 0.5) * (Math.exp(-r / 4500.0) * 220.0 + 30.0);

                  // Young luminous blue clusters populate the density waves
                  starColor = cArm.clone().lerp(cDisk, Math.random() * 0.4);
                }

                galPos[i3] = x;
                galPos[i3 + 1] = y;
                galPos[i3 + 2] = z;

                galColors[i3] = starColor.r;
                galColors[i3 + 1] = starColor.g;
                galColors[i3 + 2] = starColor.b;
              }

              galGeo.setAttribute('position', new THREE.BufferAttribute(galPos, 3));
              galGeo.setAttribute('color', new THREE.BufferAttribute(galColors, 3));
              const galaxy = new THREE.Points(galGeo, new THREE.PointsMaterial({
                size: 14.0, vertexColors: true, transparent: true, opacity: 0.8, blending: THREE.AdditiveBlending, depthWrite: false
              }));
              scene.add(galaxy);

              // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
              // 2. THE SOLAR SYSTEM & INCLINED GALACTIC FLIGHT VECTOR
              // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
              const solarBarycenter = new THREE.Group();
              solarBarycenter.quaternion.setFromAxisAngle(new THREE.Vector3(1, 0, 0), ASTRO.ECLIPTIC_TILT_RAD);
              scene.add(solarBarycenter);

              const sunTexture = createFbmTexture(512, 256, 'sun');
              const coronaTexture = createCoronaTexture();

              const sunMesh = new THREE.Mesh(
                new THREE.SphereGeometry(ASTRO.SUN_RADIUS, 32, 32),
                new THREE.MeshBasicMaterial({ map: sunTexture, color: 0xfff6dd })
              );
              solarBarycenter.add(sunMesh);

              const coronaSprite = new THREE.Sprite(
                new THREE.SpriteMaterial({
                  map: coronaTexture,
                  color: 0xffaa33,
                  transparent: true,
                  blending: THREE.AdditiveBlending,
                  depthWrite: false
                })
              );
              coronaSprite.scale.set(ASTRO.SUN_RADIUS * 6.5, ASTRO.SUN_RADIUS * 6.5, 1.0);
              solarBarycenter.add(coronaSprite);

              const sunLight = new THREE.PointLight(0xffffff, 3.2, 5000, 0.35);
              solarBarycenter.add(sunLight);
              scene.add(new THREE.AmbientLight(0xcfdcff, 0.15));

              // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
              // 3. EARTH & INVARIANT INERTIAL SPIN AXIS
              // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
              const earthOrbitNode = new THREE.Group();
              solarBarycenter.add(earthOrbitNode);

              const earthTiltNode = new THREE.Group();
              earthTiltNode.quaternion.setFromAxisAngle(new THREE.Vector3(0, 0, 1), ASTRO.OBLIQUITY_RAD);
              earthOrbitNode.add(earthTiltNode);

              const earthSpinNode = new THREE.Group();
              earthTiltNode.add(earthSpinNode);

              const earthTex = createFbmTexture(2048, 1024, 'earth');
              const cloudTex = createFbmTexture(1024, 512, 'clouds');

              const earthMesh = new THREE.Mesh(
                new THREE.SphereGeometry(ASTRO.EARTH_RADIUS, 48, 48),
                new THREE.MeshStandardMaterial({ map: earthTex, roughness: 0.6, metalness: 0.1 })
              );
              earthSpinNode.add(earthMesh);

              const cloudMesh = new THREE.Mesh(
                new THREE.SphereGeometry(ASTRO.EARTH_RADIUS * 1.018, 48, 48),
                new THREE.MeshStandardMaterial({ map: cloudTex, transparent: true, opacity: 0.85 })
              );
              earthSpinNode.add(cloudMesh);

              const atmoMesh = new THREE.Mesh(
                new THREE.SphereGeometry(ASTRO.EARTH_RADIUS * 1.14, 32, 32),
                new THREE.ShaderMaterial({
                  vertexShader: `
                    varying vec3 vNormal;
                    varying vec3 vWorldPos;
                    void main() {
                      vNormal = normalize(normalMatrix * normal);
                      vec4 wp = modelMatrix * vec4(position, 1.0);
                      vWorldPos = wp.xyz;
                      gl_Position = projectionMatrix * viewMatrix * wp;
                    }
                  `,
                  fragmentShader: `
                    varying vec3 vNormal;
                    varying vec3 vWorldPos;
                    uniform vec3 uSunPos;
                    void main() {
                      vec3 viewDir = normalize(cameraPosition - vWorldPos);
                      vec3 lightDir = normalize(uSunPos - vWorldPos);
                      float fresnel = pow(1.0 - max(dot(viewDir, vNormal), 0.0), 3.2);
                      float light = max(dot(vNormal, lightDir), 0.0) * 0.85 + 0.15;
                      gl_FragColor = vec4(0.38, 0.72, 1.0, fresnel * light * 0.95);
                    }
                  `,
                  uniforms: { uSunPos: { value: new THREE.Vector3() } },
                  side: THREE.BackSide,
                  blending: THREE.AdditiveBlending,
                  transparent: true
                })
              );
              earthTiltNode.add(atmoMesh);

              const orbitCurve = new THREE.EllipseCurve(0, 0, ASTRO.AU, ASTRO.AU, 0, Math.PI * 2);
              const orbitGeo = new THREE.BufferGeometry().setFromPoints(
                orbitCurve.getPoints(120).map(p => new THREE.Vector3(p.x, 0, p.y))
              );
              orbitGeo.rotateX(Math.PI / 2);
              solarBarycenter.add(new THREE.Line(
                orbitGeo,
                new THREE.LineBasicMaterial({ color: 0x55a8ff, transparent: true, opacity: 0.25 })
              ));

              // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
              // 4. THE LUMINOUS 3D HELICAL TRAJECTORY RIBBON
              // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
              const MAX_TRAIL = 1500;
              const trailGeo = new THREE.BufferGeometry();
              const trailPositions = new Float32Array(MAX_TRAIL * 3);
              trailGeo.setAttribute('position', new THREE.BufferAttribute(trailPositions, 3));
              const helixTrail = new THREE.Line(trailGeo, new THREE.LineBasicMaterial({
                color: 0x00d4ff, transparent: true, opacity: 0.9, blending: THREE.AdditiveBlending
              }));
              scene.add(helixTrail);
              const trailPoints = [];

              const sunTrailGeo = new THREE.BufferGeometry();
              const sunTrailPositions = new Float32Array(MAX_TRAIL * 3);
              sunTrailGeo.setAttribute('position', new THREE.BufferAttribute(sunTrailPositions, 3));
              const sunApexSpine = new THREE.Line(sunTrailGeo, new THREE.LineBasicMaterial({
                color: 0xffd60a, transparent: true, opacity: 0.35, blending: THREE.AdditiveBlending
              }));
              scene.add(sunApexSpine);
              const sunTrailPoints = [];

              const elTag = document.getElementById('act-tag');
              const elTitle = document.getElementById('hud-title');
              const elFrame = document.getElementById('stat-frame');
              const elVel = document.getElementById('stat-vel');
              const elScale = document.getElementById('stat-scale');
              const elInv = document.getElementById('stat-inv');
              const elScript = document.getElementById('script-text');

              function easeInOutCubic(t) {
                return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
              }

              // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
              // 5. MASTER CONTINUOUS FRAME RENDERER
              // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
              window.renderMasterFrame = (frameIndex, totalFrames) => {
                const progress = frameIndex / totalFrames;
                const t = progress * ASTRO.TOTAL_DURATION;

                // 1. Earth Sidereal Spin
                earthSpinNode.rotation.y = t * 4.2;
                cloudMesh.rotation.y = t * 4.6;

                // 2. Earth Heliocentric Orbit
                const orbitAngle = (t / ASTRO.EARTH_ORBIT_PERIOD_SEC) * Math.PI * 2;
                earthOrbitNode.position.set(
                  Math.cos(orbitAngle) * ASTRO.AU,
                  0,
                  Math.sin(orbitAngle) * ASTRO.AU
                );

                // 3. Solar System Flight Through Galaxy
                const earthLinearCircumference = 2 * Math.PI * ASTRO.AU;
                const vGalactic = (earthLinearCircumference * ASTRO.VEL_RATIO) / ASTRO.EARTH_ORBIT_PERIOD_SEC;
                const sunDisplacement = Math.max(0.0, t - 6.0) * vGalactic;
                solarBarycenter.position.set(sunDisplacement - 600.0, 0, 0);

                const sunWorld = new THREE.Vector3();
                sunMesh.getWorldPosition(sunWorld);
                atmoMesh.material.uniforms.uSunPos.value.copy(sunWorld);

                // 4. Record 3D Helical Path
                const earthWorld = new THREE.Vector3();
                earthMesh.getWorldPosition(earthWorld);

                if (t >= 5.0) {
                  trailPoints.push(earthWorld.clone());
                  if (trailPoints.length > MAX_TRAIL) trailPoints.shift();
                  const posAttr = helixTrail.geometry.attributes.position;
                  for (let i = 0; i < trailPoints.length; i++) {
                    posAttr.setXYZ(i, trailPoints[i].x, trailPoints[i].y, trailPoints[i].z);
                  }
                  helixTrail.geometry.setDrawRange(0, trailPoints.length);
                  posAttr.needsUpdate = true;

                  sunTrailPoints.push(sunWorld.clone());
                  if (sunTrailPoints.length > MAX_TRAIL) sunTrailPoints.shift();
                  const sunPosAttr = sunApexSpine.geometry.attributes.position;
                  for (let i = 0; i < sunTrailPoints.length; i++) {
                    sunPosAttr.setXYZ(i, sunTrailPoints[i].x, sunTrailPoints[i].y, sunTrailPoints[i].z);
                  }
                  sunApexSpine.geometry.setDrawRange(0, sunTrailPoints.length);
                  sunPosAttr.needsUpdate = true;
                }

                // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
                // 6. CONTINUOUS CINEMATIC CAMERA CHOREOGRAPHY
                // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
                if (progress <= 0.18) {
                  const p = easeInOutCubic(progress / 0.18);
                  camera.position.copy(earthWorld).add(new THREE.Vector3(
                    Math.sin(p * 0.5) * 9.0, 2.8 + p * 1.5, Math.cos(p * 0.5) * 10.0
                  ));
                  camera.lookAt(earthWorld);

                  elTag.innerText = "ACT I • THE TERRESTRIAL FRAME";
                  elTitle.innerText = "EARTH'S ROTATION";
                  elFrame.innerText = "EARTH CRUST (SURFACE)";
                  elVel.innerText = "1,674 KM/H";
                  elScale.innerText = "PLANETOCENTRIC [1:10⁶]";
                  elInv.innerText = "23.44° AXIAL OBLIQUITY";
                  elScript.innerText = '"Right now, sitting in your room, you feel completely motionless. But your reference frame is locked to a spinning sphere of rock..."';
                  helixTrail.material.opacity = 0.0;
                }
                else if (progress <= 0.42) {
                  const p = easeInOutCubic((progress - 0.18) / 0.24);
                  const startCam = earthWorld.clone().add(new THREE.Vector3(9.0, 4.0, 10.0));
                  const endCam = sunWorld.clone().add(new THREE.Vector3(0, 260, 380));

                  camera.position.lerpVectors(startCam, endCam, p);
                  camera.lookAt(sunWorld.clone().lerp(earthWorld, 1.0 - p * 0.75));

                  elTag.innerText = "ACT II • THE HELIOCENTRIC PIVOT";
                  elTitle.innerText = "ORBITING THE SUN";
                  elFrame.innerText = "HELIOCENTRIC [SUN BARYCENTER]";
                  elVel.innerText = "29.78 KM/S (~107,200 KM/H)";
                  elScale.innerText = "HELIOCENTRIC [1 AU]";
                  elInv.innerText = "ORBIT ECCENTRICITY: e = 0.0167";
                  elScript.innerText = '"Step outside Earth\'s frame into the Sun\'s gravity well, and that stillness vanishes. Earth is screaming through vacuum at nearly thirty kilometers every second."';
                  helixTrail.material.opacity = p * 0.4;
                }
                else if (progress <= 0.75) {
                  const p = easeInOutCubic((progress - 0.42) / 0.33);
                  const startCam = sunWorld.clone().add(new THREE.Vector3(0, 260, 380));
                  const endCam = sunWorld.clone().add(new THREE.Vector3(-650, 480, 850));

                  camera.position.lerpVectors(startCam, endCam, p);
                  camera.lookAt(sunWorld);

                  elTag.innerText = "ACT III • THE GALACTIC APEX";
                  elTitle.innerText = "THE INCLINED HELIX";
                  elFrame.innerText = "GALACTIC STANDARD OF REST";
                  elVel.innerText = "220 KM/S (~792,000 KM/H)";
                  elScale.innerText = "VELOCITY RATIO: 7.4 : 1";
                  elInv.innerText = "ECLIPTIC INCLINATION: 60.19°";
                  elScript.innerText = '"The Sun hurtles around Sagittarius A at 220 km/s—tilted 60 degrees. Earth does not trail behind like a comet; it weaves an elongated, inclined helix."';
                  helixTrail.material.opacity = 0.95;
                }
                else {
                  const p = easeInOutCubic((progress - 0.75) / 0.25);
                  const wideTarget = sunWorld.clone().add(new THREE.Vector3(-1100, 750, 1400));
                  camera.position.lerp(wideTarget, 0.05);
                  camera.lookAt(sunWorld.clone().add(new THREE.Vector3(-250, 0, 0)));

                  elTag.innerText = "ACT IV • THE RELATIVITY OF MOTION";
                  elTitle.innerText = "COORDINATE SYNTHESIS";
                  elFrame.innerText = "RELATIVISTIC INVARIANCE";
                  elVel.innerText = "r_gal = r_bary + R · r_helio";
                  elScale.innerText = "MULTI-SCALE WAVE";
                  elInv.innerText = "NO PREFERRED REST FRAME";
                  elScript.innerText = '"Earth has no single true path through the cosmos. Closed circle or stretched helix—the geometry of your universe depends entirely on where you choose to stand."';
                  helixTrail.material.opacity = 1.0;
                }

                renderer.render(scene, camera);
              };

              console.log("[Film Pipeline] Realistic Barred Milky Way initialized.");
            </script>
          </body>
          </html>
          EOF

      - name: Install Node Dependencies
        run: npm install

      - name: Execute Production Film Render
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
          MESA_GL_VERSION_OVERRIDE: "4.5"
          MESA_GLSL_VERSION_OVERRIDE: "450"
          GALLIUM_DRIVER: "llvmpipe"
        run: |
          if [ "${{ github.event.inputs.preview_mode }}" = "true" ]; then
            xvfb-run -s "-screen 0 1080x1920x24 -ac +extension GLX +render -noreset" npm run render:preview
          else
            xvfb-run -s "-screen 0 1080x1920x24 -ac +extension GLX +render -noreset" npm run render
          fi

      - name: Upload Final Film Artifact
        uses: actions/upload-artifact@v4
        with:
          name: cosmic-dynamics-film-master
          path: output/astrophysics_masterpiece.mp4
          retention-days: 14
