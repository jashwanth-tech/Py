name: Render Manim Animation

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install System Dependencies & TeXLive
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ffmpeg \
            libpango1.0-dev \
            pkg-config \
            dvisvgm \
            texlive-latex-base \
            texlive-latex-extra \
            texlive-fonts-recommended

      - name: Install Manim CE
        run: |
          python -m pip install --upgrade pip
          pip install manim

      - name: Verify File Exists
        run: ls -la scene.py

      - name: Render Video
        run: |
          manim -v WARNING scene.py GeodesicOrbitMaster

      - name: Upload Rendered MP4
        uses: actions/upload-artifact@v4
        with:
          name: earth-geodesic-orbit-vertical
          path: media/videos/scene/*/*.mp4
          if-no-files-found: error
