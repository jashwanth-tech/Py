name: Render Black Hole Manim Animation

on:
  workflow_dispatch:
  push:
    paths:
      - 'black_hole_future.py'
      - '.github/workflows/render.yml'

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install System Dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            ffmpeg \
            libcairo2-dev \
            libpango1.0-dev \
            pkg-config

      - name: Install Python Packages
        run: |
          python -m pip install --upgrade pip
          pip install manim numpy

      - name: Render Video with Manim (1080x1920 Vertical)
        run: |
          manim -qh -r 1080,1920 black_hole_future.py BlackHoleCausalStructure -o black_hole_future.mp4

      - name: Prepare Artifact Directory
        run: |
          mkdir -p export
          # Exclude partial chunk files and copy only the stitched master video
          find media/videos/ -type f -name "*.mp4" ! -path "*/partial_movie_files/*" -exec cp {} export/ \;
          ls -lh export/

      - name: Upload Video Artifact
        uses: actions/upload-artifact@v4
        with:
          name: black-hole-future-1080p
          path: export/*.mp4
          retention-days: 14
