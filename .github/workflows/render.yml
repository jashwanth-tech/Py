name: Render Space Video

on:
  workflow_dispatch:
    inputs:
      preview_mode:
        description: 'Run 10s preview (true) or full 45s render (false)?'
        required: true
        default: 'true'
        type: boolean

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install System Graphics & Video Libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ffmpeg \
            xvfb \
            mesa-utils \
            libgl1 \
            libglx-mesa0 \
            libgbm-dev \
            libnss3 \
            libxss1 \
            libatk-bridge2.0-0 \
            libgtk-3-0

      - name: Bootstrap Project Files
        run: |
          mkdir -p public scripts output

          # 1. package.json
          cat << 'EOF' > package.json
          {
            "name": "space-motion-visualization",
            "version": "1.0.0",
            "type": "module",
            "scripts": {
              "render": "node scripts/render.js",
              "render:preview": "node scripts/render.js --preview"
            },
            "dependencies": {
              "express": "^4.19.2",
              "puppeteer": "^22.6.0",
              "three": "^0.163.0"
            }
          }
          EOF

          # 2. scripts/render.js
          cat << 'EOF' > scripts/render.js
          import express from 'express';
          import puppeteer from 'puppeteer';
          import { spawn } from 'child_process';
          import path from 'path';
          import fs from 'fs';
          import { fileURLToPath } from 'url';

          const __dirname = path.dirname(fileURLToPath(import.meta.url));
          const ROOT = path.resolve(__dirname, '..');
          const isPreview = process.argv.includes('--preview');

          const FPS = isPreview ? 15 : 30;
          const DURATION = isPreview ? 10 : 45;
          const TOTAL_FRAMES = FPS * DURATION;
          const OUT_DIR = path.join(ROOT, 'output');
          const OUT_FILE = path.join(OUT_DIR, 'milky_way_solar_system.mp4');

          if (!fs.existsSync(OUT_DIR)) fs.mkdirSync(OUT_DIR, { recursive: true });

          const app = express();
          app.use(express.static(ROOT));
          const server = app.listen(8085, async () => {
            console.log(`[Render Engine] Target: 1080x1920 @ ${FPS} FPS (${TOTAL_FRAMES} frames)`);

            const ffmpeg = spawn('ffmpeg', [
              '-y', '-f', 'image2pipe', '-vcodec', 'png', '-r', String(FPS),
              '-i', '-', '-c:v', 'libx264', '-preset', 'fast', '-crf', '18',
              '-pix_fmt', 'yuv420p', '-movflags', '+faststart', OUT_FILE
            ]);

            ffmpeg.stderr.on('data', (d) => {
              const msg = d.toString();
              if (msg.includes('Error') || msg.includes('fatal')) console.error(`[FFmpeg] ${msg}`);
            });

            const browser = await puppeteer.launch({
              headless: 'new',
              args: [
                '--no-sandbox',
                '--disable-setuid-sandbox',
                '--disable-dev-shm-usage',
                '--disable-gpu-sandbox',
                '--enable-webgl',
                '--ignore-gpu-blocklist',
                '--use-gl=angle',
                '--use-angle=swiftshader',
                '--enable-unsafe-swiftshader',
                '--window-size=1080,1920'
              ]
            });

            const page = await browser.newPage();
            await page.setViewport({ width: 1080, height: 1920, deviceScaleFactor: 1 });

            page.on('console', msg => console.log(`[Browser] ${msg.type()}: ${msg.text()}`));
            page.on('pageerror', err => console.error(`[Browser Error] ${err.toString()}`));

            await page.goto('http://localhost:8085/public/index.html', { waitUntil: 'load' });

            console.log('[Render Engine] Waiting for 3D engine initialization...');
            await page.waitForFunction(() => typeof window.renderFrame === 'function', { timeout: 60000 });
            console.log('[Render Engine] Scene loaded successfully. Beginning frame capture.');

            for (let f = 0; f < TOTAL_FRAMES; f++) {
              await page.evaluate((curr, tot) => window.renderFrame(curr, tot), f, TOTAL_FRAMES);
              const canvas = await page.$('#webgl-canvas');
              const buf = await canvas.screenshot({ type: 'png' });
              ffmpeg.stdin.write(buf);

              if (f % 15 === 0 || f === TOTAL_FRAMES - 1) {
                console.log(`[Progress] Frame ${f + 1}/${TOTAL_FRAMES} (${(((f + 1)/TOTAL_FRAMES)*100).toFixed(1)}%)`);
              }
            }

            ffmpeg.stdin.end();
            await new Promise(res => ffmpeg.on('close', res));
            await browser.close();
            server.close();
            console.log('[Render Complete] Saved to:', OUT_FILE);
            process.exit(0);
          });
          EOF

          # 3. public/index.html
          cat << 'EOF' > public/index.html
          <!DOCTYPE html>
          <html>
          <head>
            <meta charset="UTF-8">
            <style>
              * { box-sizing: border-box; margin: 0; padding: 0; }
              body { overflow: hidden; background: #010103; font-family: -apple-system, sans-serif; }
              #webgl-canvas { width: 1080px; height: 1920px; display: block; }
              #hud {
                position: absolute; top: 0; left: 0; width: 1080px; height: 1920px;
                pointer-events: none; display: flex; flex-direction: column;
                justify-content: space-between; padding: 80px 60px; color: #ffffff;
              }
            </style>
            <script type="importmap">
              { "imports": { "three": "/node_modules/three/build/three.module.js" } }
            </script>
          </head>
          <body>
            <canvas id="webgl-canvas" width="1080" height="1920"></canvas>
            <div id="hud">
              <div>
                <div style="font-size: 20px; letter-spacing: 5px; color: #55a4ff; font-weight: 700;">ASTRONOMICAL DYNAMICS</div>
                <div id="hud-title" style="font-size: 52px; font-weight: 800; margin-top: 12px;">EARTH'S ROTATION</div>
                <div id="hud-sub" style="font-size: 26px; opacity: 0.8; margin-top: 8px;">Sidereal Period: 23h 56m | Axial Tilt: 23.44°</div>
              </div>
              <div style="display: flex; justify-content: space-between; border-top: 2px solid rgba(255,255,255,0.2); padding-top: 24px;">
                <div><div style="font-size: 18px; opacity: 0.5;">SCALE</div><div id="hud-scale" style="font-size: 26px; font-weight: 600; color: #ffd269;">PLANETOCENTRIC</div></div>
                <div style="text-align: right;"><div style="font-size: 18px; opacity: 0.5;">REFERENCE FRAME</div><div id="hud-frame" style="font-size: 26px; font-weight: 600;">EARTH SURFACE</div></div>
              </div>
            </div>

            <script type="module">
              import * as THREE from 'three';

              const CONFIG = {
                WIDTH: 1080, HEIGHT: 1920, DURATION: 45,
                EARTH_TILT_DEG: 23.44,
                ECLIPTIC_INCLINATION_TO_GALAXY_DEG: 60.19,
                SUN_RADIUS: 14.0, EARTH_RADIUS: 3.4, EARTH_ORBIT_A: 95.0,
                SUN_GALACTIC_DISTANCE: 6500, GALAXY_PARTICLES: 60000
              };

              function createNoiseTexture(w, h, fn) {
                const canvas = document.createElement('canvas');
                canvas.width = w; canvas.height = h;
                const ctx = canvas.getContext('2d');
                const img = ctx.createImageData(w, h);
                fn(img.data, w, h);
                ctx.putImageData(img, 0, 0);
                return new THREE.CanvasTexture(canvas);
              }

              const earthMap = createNoiseTexture(1024, 512, (d, w, h) => {
                for (let y = 0; y < h; y++) {
                  const lat = (y / h) * Math.PI - Math.PI / 2.0;
                  for (let x = 0; x < w; x++) {
                    const lon = (x / w) * Math.PI * 2.0 - Math.PI;
                    const idx = (y * w + x) * 4;
                    const n = Math.sin(lon * 3.0) * Math.cos(lat * 2.0) + Math.sin(lon * 7.0 + lat * 4.0) * 0.4;
                    const isLand = n > 0.12 && Math.abs(lat) < 1.35;
                    d[idx] = isLand ? 50 : 15;
                    d[idx + 1] = isLand ? 120 : 60;
                    d[idx + 2] = isLand ? 50 : 160;
                    d[idx + 3] = 255;
                  }
                }
              });

              const sunMap = createNoiseTexture(512, 256, (d, w, h) => {
                for (let i = 0; i < w * h * 4; i += 4) {
                  d[i] = 255; d[i + 1] = 215; d[i + 2] = 110; d[i + 3] = 255;
                }
              });

              const canvas = document.getElementById('webgl-canvas');
              const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, preserveDrawingBuffer: true });
              renderer.setSize(CONFIG.WIDTH, CONFIG.HEIGHT, false);

              const scene = new THREE.Scene();
              const camera = new THREE.PerspectiveCamera(48, CONFIG.WIDTH / CONFIG.HEIGHT, 0.1, 80000);

              const galGeo = new THREE.BufferGeometry();
              const pos = new Float32Array(CONFIG.GALAXY_PARTICLES * 3);
              const col = new Float32Array(CONFIG.GALAXY_PARTICLES * 3);
              const cCore = new THREE.Color(0xffdfa9), cArm = new THREE.Color(0x7ea9ff);

              for (let i = 0; i < CONFIG.GALAXY_PARTICLES; i++) {
                const i3 = i * 3;
                const r = Math.pow(Math.random(), 2.0) * 8000;
                const arm = (i % 2) * Math.PI;
                const twist = r * 0.0004;
                pos[i3] = Math.cos(arm + twist) * r + (Math.random() - 0.5) * (r * 0.2 + 20);
                pos[i3 + 1] = (Math.random() - 0.5) * 300;
                pos[i3 + 2] = Math.sin(arm + twist) * r + (Math.random() - 0.5) * (r * 0.2 + 20);
                const c = cCore.clone().lerp(cArm, Math.min(1.0, r / 6000));
                col[i3] = c.r; col[i3 + 1] = c.g; col[i3 + 2] = c.b;
              }
              galGeo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
              galGeo.setAttribute('color', new THREE.BufferAttribute(col, 3));
              const galaxy = new THREE.Points(galGeo, new THREE.PointsMaterial({ size: 16.0, vertexColors: true, transparent: true, opacity: 0.75, blending: THREE.AdditiveBlending }));
              scene.add(galaxy);

              const solarBarycenter = new THREE.Group();
              solarBarycenter.rotation.x = THREE.MathUtils.degToRad(CONFIG.ECLIPTIC_INCLINATION_TO_GALAXY_DEG);
              galaxy.add(solarBarycenter);

              const sunMesh = new THREE.Mesh(new THREE.SphereGeometry(CONFIG.SUN_RADIUS, 32, 32), new THREE.MeshBasicMaterial({ map: sunMap, color: 0xfff0d0 }));
              solarBarycenter.add(sunMesh);
              solarBarycenter.add(new THREE.PointLight(0xffffff, 2.5, 3000, 0.5));
              scene.add(new THREE.AmbientLight(0xddeeff, 0.2));

              const earthOrbitGroup = new THREE.Group();
              solarBarycenter.add(earthOrbitGroup);

              const earthTiltGroup = new THREE.Group();
              earthTiltGroup.rotation.z = THREE.MathUtils.degToRad(CONFIG.EARTH_TILT_DEG);
              earthOrbitGroup.add(earthTiltGroup);

              const earthSpinGroup = new THREE.Group();
              earthTiltGroup.add(earthSpinGroup);

              const earthMesh = new THREE.Mesh(new THREE.SphereGeometry(CONFIG.EARTH_RADIUS, 32, 32), new THREE.MeshStandardMaterial({ map: earthMap, roughness: 0.6 }));
              earthSpinGroup.add(earthMesh);

              const trailPoints = [];
              const trailGeo = new THREE.BufferGeometry();
              const trailPos = new Float32Array(600 * 3);
              trailGeo.setAttribute('position', new THREE.BufferAttribute(trailPos, 3));
              const trailLine = new THREE.Line(trailGeo, new THREE.LineBasicMaterial({ color: 0xffa500, transparent: true, opacity: 0.7, blending: THREE.AdditiveBlending }));
              scene.add(trailLine);

              const hTitle = document.getElementById('hud-title');
              const hSub = document.getElementById('hud-sub');
              const hScale = document.getElementById('hud-scale');
              const hFrame = document.getElementById('hud-frame');

              function ease(t) { return t * t * (3 - 2 * t); }

              window.renderFrame = (frame, total) => {
                const p = frame / total;
                const t = p * CONFIG.DURATION;

                earthSpinGroup.rotation.y = t * 4.0;
                const orbitAngle = t * 0.8;
                earthTiltGroup.rotation.y = -orbitAngle;
                earthOrbitGroup.position.set(Math.cos(orbitAngle) * CONFIG.EARTH_ORBIT_A, 0, Math.sin(orbitAngle) * CONFIG.EARTH_ORBIT_A);

                const galAngle = t * 0.05;
                solarBarycenter.position.set(Math.cos(galAngle) * CONFIG.SUN_GALACTIC_DISTANCE, 0, Math.sin(galAngle) * CONFIG.SUN_GALACTIC_DISTANCE);
                solarBarycenter.rotation.y = -galAngle;

                const eWorld = new THREE.Vector3();
                earthMesh.getWorldPosition(eWorld);
                trailPoints.push(eWorld);
                if (trailPoints.length > 600) trailPoints.shift();
                const attr = trailLine.geometry.attributes.position;
                for (let i = 0; i < trailPoints.length; i++) attr.setXYZ(i, trailPoints[i].x, trailPoints[i].y, trailPoints[i].z);
                trailLine.geometry.setDrawRange(0, trailPoints.length);
                attr.needsUpdate = true;

                const sWorld = new THREE.Vector3();
                sunMesh.getWorldPosition(sWorld);

                if (p < 0.25) {
                  const localT = ease(p / 0.25);
                  camera.position.copy(eWorld).add(new THREE.Vector3(Math.sin(localT * 0.5) * 8.5, 3.0, Math.cos(localT * 0.5) * 9.5));
                  camera.lookAt(eWorld);
                  hTitle.innerText = "EARTH'S ROTATION";
                  hSub.innerText = "Sidereal Period: 23h 56m | Axial Tilt: 23.44°";
                  hScale.innerText = "PLANETOCENTRIC";
                  hFrame.innerText = "EARTH SURFACE";
                } else if (p < 0.55) {
                  const localT = ease((p - 0.25) / 0.30);
                  camera.position.lerpVectors(eWorld.clone().add(new THREE.Vector3(0, 40, 60)), sWorld.clone().add(new THREE.Vector3(0, 320, 400)), localT);
                  camera.lookAt(sWorld);
                  hTitle.innerText = "HELIOCENTRIC ORBIT";
                  hSub.innerText = "Earth orbits Sun at ~29.78 km/s";
                  hScale.innerText = "HELIOCENTRIC [1 AU]";
                  hFrame.innerText = "SOLAR BARYCENTER";
                } else {
                  const localT = ease((p - 0.55) / 0.45);
                  camera.position.lerpVectors(sWorld.clone().add(new THREE.Vector3(0, 320, 400)), new THREE.Vector3(0, 7500, 11000), localT);
                  camera.lookAt(new THREE.Vector3(0, 0, 0));
                  hTitle.innerText = "GALACTIC HELICAL PATH";
                  hSub.innerText = "Solar System travels ~220 km/s through Milky Way";
                  hScale.innerText = "GALACTIC [~100,000 LY]";
                  hFrame.innerText = "MILKY WAY CORE";
                }

                renderer.render(scene, camera);
              };

              console.log("[Three.js] Initialization complete.");
            </script>
          </body>
          </html>
          EOF

      - name: Install Node Dependencies
        run: npm install

      - name: Run Headless Render via Virtual Framebuffer
        run: |
          if [ "${{ github.event.inputs.preview_mode }}" = "true" ]; then
            xvfb-run -s "-screen 0 1080x1920x24 -ac +extension GLX +render -noreset" npm run render:preview
          else
            xvfb-run -s "-screen 0 1080x1920x24 -ac +extension GLX +render -noreset" npm run render
          fi

      - name: Upload Rendered Video
        uses: actions/upload-artifact@v4
        with:
          name: cosmic-dynamics-video
          path: output/milky_way_solar_system.mp4
          retention-days: 14
