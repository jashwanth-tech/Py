name: Render Quantum Interference Video

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install system dependencies for Manim
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ffmpeg \
            libcairo2-dev \
            libpango1.0-dev \
            pkg-config

      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          pip install manim numpy

      - name: Render scene
        run: |
          manim -qh quantum_interference.py QuantumInterferenceScene

      - name: Upload rendered MP4
        uses: actions/upload-artifact@v4
        with:
          name: QuantumInterference-1080x1920
          path: media/videos/quantum_interference/1080p60/QuantumInterferenceScene.mp4
          if-no-files-found: error
