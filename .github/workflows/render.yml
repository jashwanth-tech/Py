name: Render Manim Animation

on:
  workflow_dispatch:
  push:
    paths:
      - 'spinning_top.py'
      - '.github/workflows/render.yml'

jobs:
  render:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install system dependencies & LaTeX
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ffmpeg \
            libcairo2-dev \
            libpango1.0-dev \
            pkg-config \
            dvisvgm \
            texlive-latex-base \
            texlive-latex-extra \
            texlive-fonts-extra \
            texlive-science

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install manim numpy

      - name: Render scene
        run: |
          manim spinning_top.py SpinningTopPhysics

      - name: Upload rendered video
        uses: actions/upload-artifact@v4
        with:
          name: spinning-top-vertical-video
          path: media/videos/spinning_top/*/*.mp4
          if-no-files-found: error 
